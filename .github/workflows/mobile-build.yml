name: Eidomancer mobile verification

on:
  pull_request:
    paths:
      - "mobile/**"
      - "android/**"
      - "ios/**"
      - "docs/canon/**"
      - "package*.json"
      - "capacitor.config.json"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
            --output "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          sdkmanager="$sdk_root/cmdline-tools/cmdline-tools/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null)
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run mobile:test
      - run: npm run build
      - run: npm run mobile:sync
      - run: ./gradlew assembleDebug bundleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-verification-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
