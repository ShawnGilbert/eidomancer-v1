name: Eidomancer mobile verification

on:
  pull_request:
    paths:
      - "mobile/**"
      - "android/**"
      - "ios/**"
      - "docs/canon/**"
      - "package*.json"
      - "capacitor.config.json"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run mobile:test
      - run: npm run build
      - run: npm run mobile:sync
      - run: ./gradlew assembleDebug bundleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-verification-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
